<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomous Warehouse Robot Simulator Presentation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .slide-enter { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn {

<body class="bg-slate-950 text-slate-100 font-sans antialiased m-0 p-0 overflow-hidden select-none">
  <div class="h-screen w-screen flex flex-col justify-between bg-gradient-to-br from-slate-950 via-[#0d1527] to-slate-950">
    
    <!-- Top Bar: Progress & Breadcrumbs -->
    <header class="h-12 px-6 border-b border-slate-800/80 flex items-center justify-between bg-slate-950/60 backdrop-blur z-20">
      <div class="flex items-center gap-3">
        <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
        <span class="text-xs font-semibold text-slate-200 tracking-wide uppercase font-mono">
          Warehouse AMR Simulator • Slide Deck
        </span>
      </div>
      
      <!-- Progress Bar -->
      <div class="flex-1 max-w-md mx-6 h-1.5 bg-slate-800 rounded-full overflow-hidden">
        <div id="progressBar" class="h-full bg-gradient-to-r from-cyan-500 to-emerald-400 transition-all duration-300" style="width: 10%;"></div>
      </div>

      <div class="flex items-center gap-2">
        <span id="slideCounter" class="text-xs font-mono font-bold text-cyan-400 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">
          01 / 10
        </span>
        <button id="notesToggleBtn" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-[11px] text-slate-300 font-medium transition" title="Toggle Speaker Notes">
          Speaker Notes
        </button>
      </div>
    </header>

    <!-- Main Slide Stage -->
    <main class="flex-1 flex items-center justify-center p-6 overflow-hidden relative">
      <div id="slideContainer" class="w-full max-w-5xl h-full flex flex-col justify-center slide-enter">
        <!-- Content injected dynamically via JS -->
      </div>

      <!-- Speaker Notes Drawer (Toggled) -->
      <div id="speakerNotesDrawer" class="hidden absolute bottom-4 left-6 right-6 bg-slate-900/95 border border-cyan-800/80 rounded-xl p-4 shadow-2xl backdrop-blur-md z-30 transition-all">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-xs font-bold uppercase tracking-wider text-cyan-400 font-mono">Speaker Notes & Talking Points</span>
          <button id="closeNotesBtn" class="text-slate-400 hover:text-white text-xs">✕</button>
        </div>
        <p id="speakerNotesContent" class="text-xs text-slate-300 leading-relaxed font-sans"></p>
      </div>

    <!-- Bottom Navigation Bar -->
    <footer class="h-14 px-6 border-t border-slate-800/80 flex items-center justify-between bg-slate-950/60 backdrop-blur z-20">
      <div class="flex items-center gap-2 text-xs text-slate-400">

      </div>

      <div class="flex items-center gap-2">
        <button id="prevBtn" class="px-4 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-xs font-medium text-slate-200 transition">
          ← Previous
        </button>
        <button id="nextBtn" class="px-4 py-1.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold transition shadow-lg shadow-cyan-500/20">
          Next →
        </button>
      </div>
    </footer>
  </div>

  <script>
    const slides = [
      {
        id: 1,
        title: "Autonomous Warehouse Robot Path Planning & Collision Avoidance",
        subtitle: "Decoupled Multi-Agent Coordination with Space-Time Reservations & Real-Time Replanning",
        type: "hero",
        tag: "PROJECT OVERVIEW",
        points: [
          { label: "Architecture", val: "React 18 + TypeScript + Canvas + Recharts" },
          { label: "Core Planners", val: "A* (2D) & Space-Time Cooperative A* (CA*)" },
          { label: "Conflict Guarantees", val: "Zero Vertex & Edge-Swap Collisions" },
          { label: "Runtime Resilience", val: "Dynamic Obstacle Invalidation & Deadlock Recovery" }
        ],
        notes: "Welcome everyone. Today we are presenting the Autonomous Warehouse Robot Simulator—a full-stack, research-grade platform simulating high-density autonomous mobile robots (AMRs) operating in shared fulfillment environments. The system implements authentic graph search algorithms without superficial animations."
      },
      {
        id: 2,
        title: "The Industrial Challenge: Multi-Agent Traffic & Deadlocks",
        subtitle: "Why Standard 2D Shortest Paths Fail in Shared Warehouse Aisles",
        type: "cards",
        tag: "PROBLEM STATEMENT",
        cards: [
          {
            title: "Vertex Collisions",

          {
            title: "Edge-Swap Head-On Collisions",
            color: "border-amber-500/40 bg-amber-950/20",
            textColor: "text-amber-400",
            desc: "Two AMRs in a single-cell aisle swap positions simultaneously: Robot A moves (u → v) while Robot B moves (v → u). Standard collision checking misses this transition conflict."

          {
            title: "The Scalability Trade-Off",
            color: "border-cyan-500/40 bg-cyan-950/20",
            textColor: "text-cyan-400",
            desc: "Coupled multi-agent optimal planning (CBS / ICTS) is NP-Hard with complexity O(|V|^K). Warehouses require decoupled polynomial algorithms like Prioritized Cooperative A*."

        ],

        ],
        notes: "The architecture strictly separates algorithms from React rendering. The algorithms can run headlessly in Node.js or Vitest test runners, allowing 100% deterministic unit testing and scientific benchmarking without UI overhead."
      },
      {
        id: 4,
        title: "Single-Robot A* & Heuristic Optimality",
        subtitle: "Evaluation Function f(n) = g(n) + h(n) on 4-Connected Grids",
        type: "math",
        tag: "SEARCH FOUNDATION",
        formula: "f(n) = g(n) + h(n)",
        heuristic: "h((x_1, y_1), (x_2, y_2)) = |x_1 - x_2| + |y_1 - y_2|",
        details: [
          "Admissible: Manhattan distance is the strictly shortest path in 4-directional motion with obstacles absent. Hence h(n) <= h*(n) always holds.",
          "Consistent (Monotonic): Satisfies triangle inequality h(u) <= c(u, v) + h(v), ensuring nodes are popped from the Open Set exactly once with minimal cost.",
          "Tie-Breaking: Secondary priority queue ordering prefers lower h-score or higher g-score, driving straight search frontiers directly toward the destination."
        ],
        notes: "For single robots, A* with Manhattan distance is provably optimal. We implemented a binary min-heap priority queue with secondary tie-breaking, reducing expansion times to sub-millisecond execution."
      },
      {
        id: 5,
        title: "Space-Time Cooperative A* (CA*)",
        subtitle: "State Expansion into (x, y, t) with In-Place Waiting Actions",
        type: "table",
        tag: "MULTI-AGENT ENGINE",
        rules: [
          { action: "Movement Transition", math: "(x, y, t) → (x + dx, y + dy, t + 1)", cost: "c = 1.0", effect: "AMR advances into an adjacent aisle cell" },
          { action: "In-Place Wait", math: "(x, y, t) → (x, y, t + 1)", cost: "c = 1.0 (or 1.01)", effect: "AMR yields at intersection to let higher-priority peer pass" },
          { action: "Vertex Check", math: "R_V(x, y, t+1) == empty", cost: "O(1)", effect: "Rejects collision if cell already reserved by another AMR" },
          { action: "Edge-Swap Check", math: "R_E(v → u, t) == empty", cost: "O(1)", effect: "Rejects transition if opposite robot is crossing simultaneously" },
          { action: "Goal Occupancy", math: "R_V(x_g, y_g, t) reserved for t >= t_arrival", cost: "O(1)", effect: "Parked robots at delivery docks cannot be clipped" }
        ],
        notes: "Here is the heart of multi-agent coordination: Space-Time Cooperative A*. By expanding states into 3D (x, y, t) and allowing robots to WAIT in place, lower priority robots naturally yield at intersections, letting high-priority deliveries pass through."
      },
      {
        id: 6,
        title: "Dynamic Obstacles & Real-Time Rerouting",
        subtitle: "Safe Trajectory Invalidation with Selective Reservation Rollback",
        type: "flow",
        tag: "RUNTIME ADAPTIVITY",
        steps: [
          { num: "01", title: "Hazard Injection", desc: "User clicks or schedules dynamic blockage (spill, maintenance box) at cell (x, y)." },

          { num: "03", title: "Selective Rollback", desc: "Invalidates future reservations from t_curr onwards; past trajectory history is preserved." },
          { num: "04", title: "Prioritized Re-plan", desc: "Affected robots replan around the obstacle while respecting higher-priority reservations." },
          { num: "05", title: "Safety Fallback", desc: "If no route exists within horizon H, AMR holds current position safely without clipping walls." }
        ],
        notes: "Warehouses are dynamic environments. When an obstacle drops, our system immediately checks which robots are impacted, rolls back their future reservations from the current tick, and re-routes them. Crucially, if no path exists, robots hold position safely rather than forcing their way through."

      {
        id: 7,
        title: "Deadlock Detection & Bounded Recovery",
        subtitle: "Resolving Cyclic Waiting Dependencies in Narrow Corridors",
        type: "cards",
        tag: "DEADLOCK SUBSYSTEM",
        cards: [
          {

            color: "border-purple-500/40 bg-purple-950/20",
            textColor: "text-purple-400",
            desc: "Tracks dependency graph W = (V, E) where edge A → B indicates AMR A is waiting for AMR B's cell. Detects cycles (A → B → A) persisting >= 3 ticks."

          {
            title: "Dynamic Priority Inversion",
            color: "border-cyan-500/40 bg-cyan-950/20",
            textColor: "text-cyan-400",
            desc: "When deadlock is flagged, the simulator dynamically swaps priorities of the conflicting pair and re-initiates sequential space-time planning."
          },
          {
            title: "Passing Alcove Sidestepping",

            textColor: "text-emerald-400",

      },
      {
        id: 8,
        title: "Empirical Benchmarking & Complexity Results",
        subtitle: "Monotonic High-Resolution Timing Across 1 to 10 AMRs",
        type: "stats",
        tag: "SCIENTIFIC EVALUATION",
        metrics: [
          { label: "1 AMR Planning Time", val: "0.21 ms", sub: "100% throughput efficiency" },
          { label: "4 AMRs Planning Time", val: "1.18 ms", sub: "2-4 wait steps resolved" },
          { label: "10 AMRs Planning Time", val: "4.82 ms", sub: "Linear scaling O(K·|V|·H log(|V|·H))" },
          { label: "Unit Test Verification", val: "15 / 15", sub: "Vitest suites pass in 900ms" }

        notes: "We built a scientific benchmarking suite with high-resolution monotonic timing. The results prove polynomial linear scaling in robot count K, keeping planning times well under 5 milliseconds even for 10 concurrent AMRs. All benchmark results can be exported as CSV."
      },
      {
        id: 9,
        title: "Interactive Command Center & 1-Click Execution",
        subtitle: "Industrial UX Design Built for Research and Education",
        type: "cards",
        tag: "USER EXPERIENCE",
        cards: [
          {
            title: "Dark Command Center",

          { label: "Next Steps", val: "Conflict-Based Search (CBS), non-holonomic turning radii, multi-tier mezzanines" }

    let currentSlide = 0;
    let showNotes = false;

    const slideContainer = document.getElementById('slideContainer');
    const slideCounter = document.getElementById('slideCounter');
    const progressBar = document.getElementById('progressBar');

    const nextBtn = document.getElementById('nextBtn');

    const speakerNotesDrawer = document.getElementById('speakerNotesDrawer');
    const speakerNotesContent = document.getElementById('speakerNotesContent');
    const closeNotesBtn = document.getElementById('closeNotesBtn');

    function renderSlide(index) {
      const slide = slides[index];
      slideCounter.textContent = `${String(index + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
      progressBar.style.width = `${((index + 1) / slides.length) * 100}%`;

      prevBtn.disabled = index === 0;
      nextBtn.textContent = index === slides.length - 1 ? 'Finish 🏁' : 'Next →';

      speakerNotesContent.textContent = slide.notes;

      let html = '';

      if (slide.type === 'hero') {
        html = `
          <div class="text-center max-w-3xl mx-auto space-y-6">
            <span class="px-3 py-1 rounded-full text-[11px] font-mono font-bold tracking-widest bg-cyan-950 text-cyan-400 border border-cyan-800">

              ${slide.subtitle}
            </p>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 pt-4 text-left">

              ${slide.cards.map(c => `
                <div class="p-4 rounded-xl border ${c.color} flex flex-col justify-between">

                    <h3 class="font-bold text-sm ${c.textColor} mb-2">${c.title}</h3>
                    <p class="text-xs text-slate-300 leading-relaxed">${c.desc}</p>

            <div class="p-3.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-300">
              <span class="text-emerald-400 font-bold font-mono">Scientific Rigor:</span> Isolates planning computation using high-resolution monotonic timer (<code class="text-cyan-400">performance.now()</code>) from simulation tick speed. Exportable directly to CSV for research publication.
            </div>
          </div>
        `;
      }

      slideContainer.innerHTML = html;
      slideContainer.className = "w-full max-w-5xl h-full flex flex-col justify-center slide-enter";
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'n' || e.key === 'N') {
        showNotes = !showNotes;
        speakerNotesDrawer.classList.toggle('hidden', !showNotes);
      }
    });

    nextBtn.addEventListener('click', nextSlide);
    prevBtn.addEventListener('click', prevSlide);

    notesToggleBtn.addEventListener('click', () => {
      showNotes = !showNotes;
      speakerNotesDrawer.classList.toggle('hidden', !showNotes);
    });

    closeNotesBtn.addEventListener('click', () => {
      showNotes = false;
      speakerNotesDrawer.classList.add('hidden');
    });

    // Initialize first slide
    renderSlide(currentSlide);
  </script>
</body>
</html>
